# Apache VirtualHost configuration for the PPG Laravel project
# Copy this file to your Apache sites-available directory and enable it.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /home/vascovale/Documentos/estagio-ppg-laravel/public

    <Directory /home/vascovale/Documentos/estagio-ppg-laravel/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog "/var/log/httpd/ppg-error.log"
    CustomLog "/var/log/httpd/ppg-access.log" combined
</VirtualHost>
